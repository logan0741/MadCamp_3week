events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    upstream frontend {
        server dashboard-frontend:3000;
    }

    upstream backend {
        server dashboard-backend:8000;
    }

    # HTTP -> HTTPS Redirect
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/nginx-selfsigned.key;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend/api/; # Trailing slash is important for stripping prefix if backend doesn't expect /api
            # But wait, backend expects /api/v1 prefix in code?
            # Config says API_V1_PREFIX = "/api/v1"
            # And we mounted with prefix="/api/v1".
            # So request to https://localhost/api/v1/products should go to http://backend/api/v1/products
            # If we use proxy_pass http://backend/api/, then /api/v1/ becomes /v1/ which might be wrong if prefix is included in backend router.
            # Let's check backend main.py: app.include_router(api_v1_router, prefix="/api/v1")
            # So backend listens on /api/v1/products.
            # If Nginx location is /api/, and proxy_pass is http://backend/api/, then:
            # /api/v1/products -> /api/v1/products. This seems correct.
            # Let's just forward cleanly.
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Increase timeout for crawling
            proxy_read_timeout 300s;
        }
        
        # Admin endpoints (e.g. /admin/scheduler-status) - expose via /admin/ or separate?
        # Let's expose /admin/
        location /admin/ {
            proxy_pass http://backend/admin/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
