server {
    listen 8080;
    server_name localhost;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ===========================================
    # JSON API Results (AI Engine outputs)
    # ===========================================
    location /data/outputs/ {
        alias /data/outputs/;
        
        # JSON handling
        location ~* \.json$ {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Cache-Control "public, max-age=3600";
        }
        
        # GLB 3D models
        location ~* \.glb$ {
            add_header Content-Type model/gltf-binary;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }
        
        # OBJ 3D models
        location ~* \.obj$ {
            add_header Content-Type text/plain;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }
        
        # Enable directory listing for debugging (disable in production)
        autoindex on;
        autoindex_format json;
    }

    # ===========================================
    # Image Files (PNG, JPG, WEBP)
    # ===========================================
    location /data/images/ {
        alias /data/images/;
        
        # Image MIME types
        location ~* \.(png|jpg|jpeg|webp|gif)$ {
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
            expires 1d;
        }
        
        autoindex on;
        autoindex_format json;
    }

    # ===========================================
    # Upload directory (for temporary files)
    # ===========================================
    location /data/uploads/ {
        alias /data/uploads/;
        add_header Access-Control-Allow-Origin *;
        
        # Restrict to GET only
        limit_except GET {
            deny all;
        }
    }

    # ===========================================
    # CORS Preflight Handler
    # ===========================================
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        return 404;
    }

    # ===========================================
    # Logging
    # ===========================================
    access_log /var/log/nginx/static_access.log;
    error_log /var/log/nginx/static_error.log;

    # ===========================================
    # Performance Tuning
    # ===========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Gzip compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;
}
