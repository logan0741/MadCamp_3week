version: '3.8'

services:
  # ===========================================
  # Frontend - Next.js Application
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: memeforty-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    # Remove redundant environment variables that are in .env.prod
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - memeforty-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # Backend - FastAPI Main API Server
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memeforty-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Remove redundant environment variables that are in .env.prod
    volumes:
      - ./backend/app.db:/app/app.db
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - memeforty-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # PostgreSQL - Main Database
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: memeforty-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env.prod
    # Remove redundant environment variables that are in .env.prod
    volumes:
      - postgres-data-v3:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    networks:
      - memeforty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memeforty}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Autossh - Reverse SSH Tunnel to External VPS
  # ===========================================
  autossh:
    build:
      context: ./autossh
      dockerfile: Dockerfile
    container_name: memeforty-autossh
    env_file:
      - .env.prod
    # Remove redundant environment variables that are in .env.prod
    volumes:
      - ${SSH_KEY_PATH:-~/.ssh/id_rsa}:/root/.ssh/id_rsa:ro
      - ${SSH_KNOWN_HOSTS:-~/.ssh/known_hosts}:/root/.ssh/known_hosts:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - memeforty-network

  # ===========================================
  # Nginx - Reverse Proxy
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: memeforty-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - memeforty-network

# ===========================================
# Named Volumes
# ===========================================
volumes:
  postgres-data-v3:
    driver: local

# ===========================================
# Network Configuration
# ===========================================
networks:
  memeforty-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
