server {
    listen 80;
    server_name proxy.internal;

    # Simple header auth (set to empty to disable)
    set $required_key "CHANGE_ME_PROXY_KEY";
    if ($required_key != "" ) {
        if ($http_x_proxy_key != $required_key) { return 403; }
    }

    # Common proxy headers
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ===========================
    # Musinsa API
    # ===========================
    location /api2/ {
        proxy_pass https://api.musinsa.com/api2/;
        proxy_set_header Host api.musinsa.com;
        proxy_ssl_server_name on;
    }

    # ===========================
    # Musinsa product pages
    # ===========================
    location /products/ {
        proxy_pass https://www.musinsa.com/products/;
        proxy_set_header Host www.musinsa.com;
        proxy_ssl_server_name on;
    }

    location /app/goods/ {
        proxy_pass https://www.musinsa.com/app/goods/;
        proxy_set_header Host www.musinsa.com;
        proxy_ssl_server_name on;
    }

    location /categories/ {
        proxy_pass https://www.musinsa.com/categories/;
        proxy_set_header Host www.musinsa.com;
        proxy_ssl_server_name on;
    }

    # ===========================
    # Goods detail (size API)
    # ===========================
    location /goods-detail/ {
        proxy_pass https://goods-detail.musinsa.com/;
        proxy_set_header Host goods-detail.musinsa.com;
        proxy_ssl_server_name on;
    }

    # ===========================
    # Image CDN
    # ===========================
    location /images/ {
        proxy_pass https://image.msscdn.net/images/;
        proxy_set_header Host image.msscdn.net;
        proxy_ssl_server_name on;
    }

    # ===========================
    # OneLink share
    # ===========================
    location /onelink/ {
        proxy_pass https://musinsa.onelink.me/;
        proxy_set_header Host musinsa.onelink.me;
        proxy_ssl_server_name on;
    }

    location /app-link/ {
        proxy_pass https://musinsa.app.link/;
        proxy_set_header Host musinsa.app.link;
        proxy_ssl_server_name on;
    }
}
