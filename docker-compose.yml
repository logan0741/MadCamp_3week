version: '3.8'

services:
  # Database Service (PostgreSQL)
  dashboard-db:
    image: postgres:15-alpine
    container_name: dashboard-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: musinsa_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d musinsa_tracker" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service
  dashboard-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dashboard-backend
    restart: always
    depends_on:
      dashboard-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@dashboard-db:5432/musinsa_tracker
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/venv
    networks:
      - app-network

  # Frontend Service
  dashboard-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://localhost/api/v1
    container_name: dashboard-frontend
    restart: always
    environment:
      API_URL: http://dashboard-backend:8000
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - dashboard-backend
      - dashboard-frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
